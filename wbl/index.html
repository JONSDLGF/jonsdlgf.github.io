<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Web Browser Local</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.min.js"></script>
  <script>
    let SQL;
    let db;

    async function initSql() {
      // Carga SQL.js (wasm)
      SQL = await initSqlJs({
        locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/${file}`
      });
    }

    async function loadDb(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("No se pudo cargar: " + url);
      const bytes = await res.arrayBuffer();

      // Abre SQLite en memoria (local)
      db = new SQL.Database(new Uint8Array(bytes));
    }

    function escapeForLike(s) {
      // '%' y '_' tienen significado en LIKE; escapamos.
      return s.replaceAll('\\', '\\\\').replaceAll('%', '\\%').replaceAll('_', '\\_');
    }

    async function button_Go() {
      const q = document.getElementById("text").value.trim();
      if (!q) return;

      const lang = document.getElementById("lang").value; // es_ES | en_US
      const like = `%${escapeForLike(q)}%`;

      const stmt = db.prepare(`
        SELECT
          title,
          url,
          json_extract(text, '$.' || ?) AS text_lang,
          topics
        FROM main
        WHERE title LIKE ? ESCAPE '\\'
           OR json_extract(text, '$.' || ?) LIKE ? ESCAPE '\\'
           OR topics LIKE ? ESCAPE '\\'
        LIMIT 20
      `);

      stmt.bind([lang, like, lang, like, like]);

      const results = [];
      while (stmt.step()) {
        results.push(stmt.getAsObject());
      }
      stmt.free();

      display(results);
    }

    function display(results) {
      const content = document.getElementById("content");
      if (results.length === 0) {
        content.style.whiteSpace = "pre-line";
        content.textContent = `Sin resultados, estamos en ello +10 url indexados, quieres poner wbl como predeterminado codigo:\n"https://jonsdlgf.github.io/wbl/?q=%s" o en local "http://localhost:8000/?q=%s"?`;
        return;
      }

      content.innerHTML = "";
      for (const r of results) {
        const div = document.createElement("div");
        div.style.margin = "8px 0";
        div.innerHTML = `
          <a href="${r.url}" target="_blank" rel="noreferrer">${r.title}</a>
          <div style="color:#aaa; font-size: 0.9em;">${r.topics}</div>
          <div style="color:#ddd;">${String(r.text_lang || '').slice(0, 140)}</div>
        `;
        content.appendChild(div);
      }
    }

    function getQueryParam(name) {
     const params = new URLSearchParams(window.location.search);
     return params.get(name);
    }

    window.addEventListener("DOMContentLoaded", async () => {
     await initSql();
     await loadDb("./searchmain.db");

     const qFromUrl = getQueryParam("q");
     if (qFromUrl) {
      document.getElementById("text").value = qFromUrl;
      // Si quieres que busque automáticamente al cargar:
      button_Go();
     }
    });
  </script>
</head>

<body style="margin:0; background:#000; color:#fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;">
  <div style="max-width:900px; margin:0 auto; padding:18px;">
    
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <input
        id="text"
        type="text"
        placeholder="Search"
        style="flex:1; min-width:220px; padding:10px 12px; border-radius:10px; border:1px solid #333; background:#111; color:#fff; outline:none;"
      >

      <button
        onclick="button_Go()"
        style="padding:10px 16px; border-radius:10px; border:1px solid #333; background:#1f1f1f; color:#fff; cursor:pointer;"
      >
        Go
      </button>

      <div style="margin-left:auto; font-size:14px; color:#bdbdbd; padding:6px 12px; border:1px solid #333; border-radius:999px;">
        Beta
      </div>
    </div>

    <!-- Selector de idioma (después de Go) -->
    <div style="margin-top:12px; display:flex; align-items:center; gap:10px;">
      <label for="lang" style="color:#bdbdbd; font-size:14px;">Language</label>
      <select
        id="lang"
        style="padding:10px 12px; border-radius:10px; border:1px solid #333; background:#111; color:#fff; outline:none; margin-left:0;"
      >
        <option value="es_ES">es_ES</option>
        <option value="en_US">en_US</option>
      </select>
    </div>

    <hr style="border:none; border-top:1px solid #222; margin:16px 0;">

    <div id="content"></div>
  </div>
</body>
</html>
